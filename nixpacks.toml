[phases.setup]
nixPkgs = ["curl"]

[phases.install]
cmds = [
  "curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0 --install-dir /opt/dotnet",
  "export PATH=/opt/dotnet:$PATH && dotnet restore OuvidoriaCatolica.sln"
]

[phases.build]
cmds = [
  "export PATH=/opt/dotnet:$PATH && dotnet publish src/OuvidoriaCatolica.API/OuvidoriaCatolica.API.csproj --no-restore -c Release -o out"
]

[start]
cmd = "PATH=/opt/dotnet:$PATH ./out/OuvidoriaCatolica.API"